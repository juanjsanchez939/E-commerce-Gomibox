services:
  mongodb:
    image: mongo:7
    container_name: gomibox-mongodb
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: gomibox
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
